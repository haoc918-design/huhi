let exam=[],pos=0,answers={},submitted=false,wrong=new Set();

function stats(){
  $('total').textContent=Q.length;

  $('mistakes').textContent=wrong.size;
}
function currentScore(){return exam.filter(q=>answers[q[0]]===q[5]).length}

  let n=+$('count').value;
  exam=Q.slice().sort(()=>Math.random()-.5).slice(0,n);
  pos=0;answers={};submitted=false;wrong=new Set();stats();render();
}

  let q=exam[pos], chosen=answers[q[0]], hasAnswered=chosen!==undefined;
  let h=`<div class="stats"><div><b>Điểm hiện tại: ${currentScore()}/${Object.keys(answers).length}</b></div><div class="muted">Đã trả lời ${Object.keys(answers).length}/${exam.length} câu</div></div>`;
  h+=`<div class="muted">Câu ${pos+1}/${exam.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/exam.length*100}%"></div></div><h3>Câu ${q[0]}. ${esc(q[1])}</h3>`;
  q[4].forEach((v,i)=>{
    let cls='';
    if(hasAnswered && i===q[5]) cls='good';
    else if(hasAnswered && i===chosen && chosen!==q[5]) cls='bad';
    h+=`<button class="option ${chosen===i?'chosen':''}" data-i="${i}" ${hasAnswered?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(v)}</button>`;
  });
  if(hasAnswered){
    let ok=chosen===q[5];
    h+=`<div class="card"><b class="${ok?'good':'bad'}">${ok?'✓ Chính xác!':'✗ Chưa đúng.'} Đáp án đúng: ${'ABCD'[q[5]]}</b><p>${esc(q[2])}</p><p class="muted">${esc(q[3])}</p></div>`;
  } else {
    h+=`<p class="muted small">Chọn một đáp án để xem kết quả ngay lập tức.</p>`;
  }
  h+=`<div class="toolbar"><button id="prev" ${pos===0?'disabled':''}>← Trước</button><button id="next" class="primary" ${!hasAnswered?'disabled':''}>${pos===exam.length-1?'Xem kết quả':'Câu tiếp theo →'}</button></div>`;
  $('question').innerHTML=h;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    if(answers[q[0]]===undefined){
      answers[q[0]]=+b.dataset.i;
      if(answers[q[0]]!==q[5]) wrong.add(q[0]);
      stats();render();
    }
  });
  $('prev').onclick=()=>{if(pos>0){pos--;render()}};
  $('next').onclick=()=>{if(pos<exam.length-1){pos++;render()}else result()};
}
function result(){
  let score=currentScore(), attempted=Object.keys(answers).length;
  $('question').innerHTML=`<div style="text-align:center;padding:20px"><div class="muted">KẾT QUẢ BÀI THI</div><h1>${score}/${exam.length}</h1><p>Đúng ${score} câu · Sai ${attempted-score} câu · Chưa làm ${exam.length-attempted} câu</p><p>${score/exam.length>=.8?'Rất tốt!':score/exam.length>=.5?'Cố gắng thêm nhé!':'Hãy ôn lại kiến thức nhé!'}</p><button id="review">Xem lại từng câu</button> <button id="again" class="primary">Thi lại</button></div>`;
  $('review').onclick=()=>{pos=0;render()};
  $('again').onclick=start;
}
function lookup(){let term=$('query').value.trim().toLocaleLowerCase('vi'),filter=$('filter').value;let found=Q.filter(q=>{let known=!!q[4];if(filter==='known'&&!known||filter==='missing'&&known)return false;return !term||(q.join(' ').toLocaleLowerCase('vi').includes(term))});$('results').innerHTML=found.length?found.map(q=>`<details class="card"><summary>Câu ${q[0]}. ${esc(q[1])}<div class="muted small">${q[4]?'Có đáp án':'Chưa có đáp án'}</div></summary><p><b>${esc(q[2])}</b></p><p class="muted">${esc(q[3])}</p>${q[4]?`<p>Đáp án lựa chọn: <b>${'ABCD'[q[5]]}</b></p>`:''}</details>`).join(''):'<div class="card">Không tìm thấy câu phù hợp.</div>'}
$('start').onclick=start;$('query').oninput=lookup;$('filter').onchange=lookup;lookup();stats();
</script></body></html>
